.header h1{font-size:20px;font-weight:700;letter-spacing:1px}

.type-bar{display:flex;overflow-x:auto;margin-bottom:4px;gap:6px;padding:4px 0 10px 0;scrollbar-width:thin;scrollbar-color:#d32f2f #f0f0f0}

.type-bar::-webkit-scrollbar-track{background:#f0f0f0;border-radius:3px;margin:0 10px}
.type-bar::-webkit-scrollbar-thumb{background:#d32f2f;border-radius:3px}
.type-btn{padding:6px 14px;border-radius:20px;background:var(--card);cursor:pointer;white-space:nowrap;font-size:13px;border:1.5px solid #e0e0e0;transition:all .2s;font-weight:500;text-decoration:none;color:var(--text);display:inline-block}
.type-btn.active{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 2px 8px rgba(244,67,54,.3)}
.type-btn.jc-link{background:var(--red);color:#fff;border-color:var(--red)}
.card{background:var(--card);margin:8px 12px;padding:14px;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.page{padding:4px 0 70px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page.active{display:block;animation:fadeIn .25s ease}
.match-card{background:#fff;margin:8px 12px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
.match-top{padding:10px 12px;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:8px}
.match-star{color:#ff9800;font-size:14px}
.match-league{font-size:11px;color:#888}
.match-time{font-size:10px;color:#999;margin-left:auto}
.match-body{padding:10px 12px}
.match-teams{font-size:15px;font-weight:700;margin-bottom:6px}
.match-vs{color:#999;font-size:12px;font-weight:400;margin:0 4px}
.match-odds{display:flex;gap:8px;margin:8px 0}
.odds-box{flex:1;text-align:center;padding:6px 4px;background:#fafafa;border-radius:8px}
.odds-box .odds-label{font-size:10px;color:#999;margin-bottom:2px}
.odds-box .odds-val{font-size:16px;font-weight:700;color:var(--text)}
.odds-box.pick{background:#fff5f5;border:1.5px solid var(--red)}
.odds-box.pick .odds-val{color:var(--red)}
.match-rec{display:flex;align-items:center;gap:8px;margin-top:6px;padding:6px 10px;background:#fff5f5;border-radius:6px;font-size:13px;color:var(--red);font-weight:700}
.match-conf{font-size:11px;background:var(--red);color:#fff;padding:1px 6px;border-radius:8px;font-weight:400}
.match-detail{display:none;padding:0 12px 10px 12px;border-top:1px solid #f5f5f5}
.match-detail.open{display:block}
.detail-btn{font-size:10px;color:#999;cursor:pointer;padding:4px;text-align:center;border-top:1px solid #f5f5f5;user-select:none}
.detail-btn:hover{background:#fafafa}
.empty-box{text-align:center;padding:40px 12px;color:#999;font-size:14px;line-height:2}
.footer{position:fixed;bottom:0;width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid #eee;z-index:100}
.footer .tab-btn{flex:1;padding:10px 0;border:none;background:none;cursor:pointer;font-size:13px;color:#999;font-weight:500;text-align:center;text-decoration:none;display:block}
.footer .tab-btn.active{color:var(--red);font-weight:700}
.loading{text-align:center;padding:60px 0;color:#999;font-size:14px}
.loading .spinner{width:24px;height:24px;border:3px solid #f0f0f0;border-top-color:var(--red);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

    });
    html += '</div>';
    html += '<div class="match-rec">🏆 推荐 ' + r.recommend + ' @ ' + r.best_odds + ' <span class="match-conf">' + (r.confidence||'⭐') + '</span></div>';
    
    var detailId = 'detail_' + idx;
    var hasReasons = r.reasons && r.reasons.length > 0;
    html += '<div class="detail-btn" onclick="toggleDetail(\'' + detailId + '\')">' + (hasReasons ? '📊 查看分析理由 ▼' : '📊 价值评分: ' + r.score) + '</div>';
    html += '<div class="match-detail" id="' + detailId + '">';
    if (hasReasons) {
      html += '<div style="padding:8px 0;font-size:12px;color:#666;line-height:1.8">';
      r.reasons.forEach(function(reason) { html += '• ' + reason + '<br>'; });
      html += '</div>';
    }
    // 阵容深度展示
    if (r.home_players || r.away_players) {
      html += '<div style="margin:8px 0;padding:8px;background:#f8f9fa;border-radius:8px;font-size:11px;line-height:1.6">';
      if (r.home_players) {
        var hc = r.home_coach && r.home_coach !== '—' ? ' ' + r.home_coach : '';
        html += '<div style="font-weight:600;margin-bottom:4px">' + r.homeTeam + ': ' + (r.home_player_count||'?') + '人' + hc + (r.home_avg_age ? ' 均龄' + r.home_avg_age + '岁' : '') + '</div>';
        html += '<div style="color:#888">' + r.home_players.slice(0,5).join(', ') + '</div>';
      }
      if (r.away_players) {
        var ac = r.away_coach && r.away_coach !== '—' ? ' ' + r.away_coach : '';
        html += '<div style="font-weight:600;margin:4px 0 4px 0">' + r.awayTeam + ': ' + (r.away_player_count||'?') + '人' + ac + (r.away_avg_age ? ' 均龄' + r.away_avg_age + '岁' : '') + '</div>';
        html += '<div style="color:#888">' + r.away_players.slice(0,5).join(', ') + '</div>';
      }
      html += '</div>';
    }
    html += '<div style="font-size:11px;color:#999;padding:4px 0;border-top:1px solid #f5f5f5">';
    html += '评分: ' + r.score;
    if (r.ev !== undefined) html += ' | EV: ' + (r.ev > 0 ? '<span style="color:#4caf50">' : '') + (r.ev > 0 ? '+' : '') + r.ev + '%' + (r.ev > 0 ? '</span>' : '');
    html += ' | 抽水: ' + r.juice + '%';
    // 价值重叠分析：市场隐含概率 vs 模型公平概率
    if (r.value_overlay && r.value_overlay.length > 0) {
      var vo = r.value_overlay;
      html += '<div style="margin-top:4px;font-size:10px;border-top:1px dashed #eee;padding-top:4px">';
      html += '<span style="font-weight:600">价值对标:</span> ';
      vo.forEach(function(v, vi) {
        var cls = '';
        if (v.label === r.recommend) cls = ' style="color:#c62828;font-weight:700"';
        html += '<span' + cls + '>' + v.label + ' 市场' + v.market_prob + '% vs 模型' + v.fair_prob + '%' + (v.value_gap > 0 ? ' ▲' : '') + (v.value_gap < 0 ? ' ▼' : '') + '</span>';
        if (vi < vo.length - 1) html += ' | ';
      });
      html += '</div>';
    }
    // 球队状态（当有数据时显示）
    if (r.home_form && r.away_form) {
      html += '<div style="font-size:10px;color:#666;margin-top:2px">';
      html += r.homeTeam + ' ' + r.home_form + ' | ' + r.awayTeam + ' ' + r.away_form;
      html += '</div>';
    }
    // 凯利建议
    if (r.kelly_advice && r.kelly_advice.suggest_stake > 0) {
      html += '<br>💰 ' + r.kelly_advice.note;
    }
    if (r.home_group) html += '<br>📌 ' + r.home_group + ' | ' + r.homeTeam + ' 实力:' + (r.home_strength||'?') + ' ' + r.awayTeam + ' 实力:' + (r.away_strength||'?');
    html += '</div></div>';
    html += '</div></div>';
  });
  
  ml.innerHTML = html;
  ml.style.display = 'block';
  
  if (recs.length === 0) { ml.style.display = 'none'; em.style.display = 'block'; }
}

function init() {
  var ml = document.getElementById('matchList');
  var ld = document.getElementById('loadingIndicator');
  var em = document.getElementById('emptyMessage');
  
  // 先用内嵌数据渲染
  if (JC_DATA && JC_DATA.recommendations && JC_DATA.recommendations.length > 0) {
    renderData(JC_DATA);
  } else {
    ld.style.display = 'none';
    em.style.display = 'block';
  }
  
  // 同时尝试fetch最新数据（如果成功则覆盖）
  fetch('jc_recommend.json?_t=' + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error('No remote data');
      return r.json();
    })
    .then(function(data) {
      if (data && data.recommendations && data.recommendations.length > 0) {
        renderData(data);
      }
    })
    .catch(function() {
      // 静默失败，已用内嵌数据展示
    });
}

function toggleDetail(id) {
  var el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body></html>
