// ===== 泊松 =====
function poisson(k, lam) {
  if (k > 150 || lam <= 0) return 0;
  var r = Math.exp(-lam);
  for (var i = 1; i <= k; i++) r *= lam / i;
  return r;
}

function analyze(m) {
  var h = m.had, hh = m.hhad, gl = parseFloat(m.gl);
  // HAD去水
  var hs = 1/h[0]+1/h[1]+1/h[2];
  var ph = 1/h[0]/hs, pd = 1/h[1]/hs, pa = 1/h[2]/hs;
  // HHAD去水
  var hhs = 1/hh[0]+1/hh[1]+1/hh[2];
  var phc = 1/hh[0]/hhs, php = 1/hh[1]/hhs, pac = 1/hh[2]/hhs;

  // 泊松拟合
  var bestErr = 999, bl = 1, bu = 1, agl = Math.abs(gl);

  if (gl < 0) {
    for (var lh = 0.5; lh <= 4; lh += 0.1) {
      for (var la = 0; la <= 2; la += 0.1) {
        var p1 = 0, p2 = 0, p3 = 0;
        for (var h0 = 0; h0 < 11; h0++) for (var a0 = 0; a0 < 7; a0++) {
          var prob = poisson(h0,lh)*poisson(a0,la);
          if (h0-a0 >= agl+1) p1 += prob;
          else if (h0-a0 === agl) p2 += prob;
          else p3 += prob;
        }
        var err = Math.abs(p1-phc)+Math.abs(p2-php)+Math.abs(p3-pac);
        if (err < bestErr) { bestErr = err; bl = lh; bu = la; }
      }
    }
    // 概率
    var by1 = 0, by2p = 0;
    for (var h0=0;h0<11;h0++) for(var a0=0;a0<7;a0++) {
      var prob = poisson(h0,bl)*poisson(a0,bu);
      if (h0>a0 && h0-a0===1) by1 += prob;
      else if (h0>a0 && h0-a0>=2) by2p += prob;
    }
    var pd2 = 0; for (var s=0;s<11;s++) pd2 += poisson(s,bl)*poisson(s,bu);
    var pa2 = 1 - by1 - by2p - pd2;
    
    // 单选: 只买一个方向，HAD主胜 vs HHAD客受让
    var ev_had = (by1+by2p)*h[0];           // 只买HAD主胜
    var ev_hhad = (by1+pd2+pa2)*hh[2];      // 只买HHAD客受让
    var pick = ev_had > ev_hhad ? 'had' : 'hhad';
    // 碾压保护: 强队打弱队首轮易打穿，HAD主胜<1.35时强制买HAD
    var crushed = false;
    if (h[0] <= 1.35 && pick === 'hhad') { pick = 'had'; crushed = true; }
    
    return {
      pick: pick,
      market: pick === 'had' ? '胜平负' : '让球('+m.gl+')胜平负',
      sel: pick === 'had' ? '胜' : '负',
      desc: crushed ? (m.home+'赢（碾压保护）') : (pick === 'had' ? (m.home+'赢') : (m.away+'+'+Math.abs(gl)+'球不败')),
      odds: pick === 'had' ? h[0] : hh[2],
      ev: crushed ? ev_had : Math.max(ev_had, ev_hhad),
      roi: crushed ? Math.round((ev_had-1)*1000)/10 : Math.round((Math.max(ev_had, ev_hhad)-1)*1000)/10,
      hWin: Math.round((by1+by2p)*1000)/10,
      draw: Math.round(pd2*1000)/10,
      aWin: Math.round(pa2*1000)/10,
      err: Math.round(bestErr*1000)/10,
      lam: bl+'/'+bu,
      altMarket: pick === 'had' ? '让球('+m.gl+')胜平负' : '胜平负',
      altSel: pick === 'had' ? '负' : '胜',
      altDesc: pick === 'had' ? (m.away+'+'+Math.abs(gl)+'球不败') : (m.home+'赢'),
      altOdds: pick === 'had' ? hh[2] : h[0]
    };
  } else { // gl > 0
    for (var lh = 0; lh <= 2; lh += 0.1) {
      for (var la = 0.5; la <= 4; la += 0.1) {
        var p1 = 0, p2 = 0, p3 = 0;
        for (var h0 = 0; h0 < 11; h0++) for (var a0 = 0; a0 < 7; a0++) {
          var prob = poisson(h0,lh)*poisson(a0,la);
          var diff = h0 - a0;
          if (diff >= -1) p1 += prob;
          else if (diff === -2) p2 += prob;
          else p3 += prob;
        }
        var err = Math.abs(p1-phc)+Math.abs(p2-php)+Math.abs(p3-pac);
        if (err < bestErr) { bestErr = err; bl = lh; bu = la; }
      }
    }
    var awBy1 = 0, awBy2p = 0;
    for (var h0=0;h0<11;h0++) for(var a0=0;a0<7;a0++) {
      var prob = poisson(h0,bl)*poisson(a0,bu);
      if (a0>h0 && a0-h0===1) awBy1 += prob;
      else if (a0>h0 && a0-h0>=2) awBy2p += prob;
    }
    var pd2 = 0; for (var s=0;s<11;s++) pd2 += poisson(s,bl)*poisson(s,bu);
    var ph2 = 0; for (var h0=1;h0<11;h0++) for(var a0=0;a0<h0;a0++) ph2 += poisson(h0,bl)*poisson(a0,bu);
    
    // 单选: 只买一个方向，HAD客胜 vs HHAD主受让
    var ev_had = (awBy1+awBy2p)*h[2];      // 只买HAD客胜
    var ev_hhad = (awBy1+ph2+pd2)*hh[0];   // 只买HHAD主受让
    var pick = ev_had > ev_hhad ? 'had' : 'hhad';
    // 碾压保护: 强队打弱队首轮易打穿，HAD客胜<1.35时强制买HAD
    var crushed2 = false;
    if (h[2] <= 1.35 && pick === 'hhad') { pick = 'had'; crushed2 = true; }
    
    return {
      pick: pick,
      market: pick === 'had' ? '胜平负' : '让球(+'+Math.abs(gl)+')胜平负',
      sel: pick === 'had' ? '负' : '胜',
      desc: crushed2 ? (m.away+'赢（碾压保护）') : (pick === 'had' ? (m.away+'赢') : (m.home+'+'+Math.abs(gl)+'球不败')),
      odds: pick === 'had' ? h[2] : hh[0],
      ev: crushed2 ? ev_had : Math.max(ev_had, ev_hhad),
      roi: crushed2 ? Math.round((ev_had-1)*1000)/10 : Math.round((Math.max(ev_had, ev_hhad)-1)*1000)/10,
      hWin: Math.round(ph2*1000)/10,
      draw: Math.round(pd2*1000)/10,
      aWin: Math.round((awBy1+awBy2p)*1000)/10,
      err: Math.round(bestErr*1000)/10,
      lam: bl+'/'+bu,
      altMarket: pick === 'had' ? '让球(+'+Math.abs(gl)+')胜平负' : '胜平负',
      altSel: pick === 'had' ? '胜' : '负',
      altDesc: pick === 'had' ? (m.home+'+'+Math.abs(gl)+'球不败') : (m.away+'赢'),
      altOdds: pick === 'had' ? hh[0] : h[2]
    };
  }
}

// 判断是否已过
function isPassed(m) {
  var dt = new Date(m.date + 'T' + m.time + ':00+08:00');
  return dt < new Date();
}

// 渲染
function render(filterMode) {
  var html = '';
  var now = new Date();
  var today = now.toISOString().slice(0,10);
  
  MATCHES.forEach(function(m) {
    var r = analyze(m);
    var h = m.had, hh = m.hhad, gl = parseFloat(m.gl);
    var passed = isPassed(m);
    
    // 根据匹配筛选
    var matchDay = m.date;
    if (filterMode === 'today' && (passed || matchDay < today)) return;

    var roiClass = r.roi > 10 ? 'roi-high' : (r.roi > 0 ? 'roi-mid' : 'roi-low');
    var boxClass = r.roi < 0 ? 'negative' : '';
    var statusTag = passed ? '<span style="color:#999;font-size:11px">已结束</span>' 
      : (matchDay === today ? '<span style="color:#e65100;font-size:11px;font-weight:700">🔥 今天</span>' 
        : '<span style="color:#1565c0;font-size:11px">即将</span>');

    html += '<div class="card' + (passed ? ' passed' : '') + '">';
    html += '<div class="match-header">';
    html += '<div class="match-teams">' + m.match + ' ' + m.home + ' vs ' + m.away + '</div>';
    html += '<div class="match-time">' + m.date.slice(5) + ' ' + m.time + ' ' + statusTag + '</div>';
    html += '</div>';

    html += '<div style="font-size:12px;color:#888;margin-bottom:8px">';
    html += 'HAD ' + m.had[0].toFixed(2) + '/' + m.had[1].toFixed(2) + '/' + m.had[2].toFixed(2);
    html += ' | HHAD' + m.gl + ' ' + m.hhad[0].toFixed(2) + '/' + m.hhad[1].toFixed(2) + '/' + m.hhad[2].toFixed(2);
    html += '</div>';

    // 单选推荐
    html += '<div class="strategy-box ' + boxClass + '" style="padding:12px">';
    html += '<span class="roi-badge ' + roiClass + '">期望' + (r.roi > 0 ? '+' : '') + r.roi.toFixed(0) + '%</span>';
    html += '<div style="font-size:13px;color:#888;margin-top:2px">' + m.home + ' vs ' + m.away + '</div>';
    html += '<div style="font-size:15px;font-weight:700;margin:6px 0">';
    html += '📌 [' + r.market + '] 选 <b style="color:#e65100;font-size:17px">「' + r.sel + '」</b>';
    html += ' <span style="color:#e65100">@' + r.odds.toFixed(2) + '</span>';
    html += '</div>';
    html += '<div style="font-size:12px;color:#666">' + r.desc + ' 即中奖 | 1元→' + r.ev.toFixed(2) + '元</div>';
    html += '<div style="font-size:11px;color:#999;margin-top:6px;border-top:1px dashed #ddd;padding-top:6px">';
    html += '备选: [' + r.altMarket + '] 选「' + r.altSel + '」(' + r.altDesc + ') @' + r.altOdds.toFixed(2);
    html += '</div>';
    html += '</div></div>';
  });

  document.getElementById('matchList').innerHTML = html || '<div class="card" style="text-align:center;color:#999;padding:30px">没有符合条件的比赛</div>';
  document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
}

function filter(mode, e) {
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  e.target.classList.add('active');
  render(mode);
}
