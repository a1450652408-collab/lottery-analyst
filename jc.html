<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>竞彩足球 · V6 反热门分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,Segoe UI,sans-serif;background:#f5f5f5;color:#333;max-width:480px;margin:0 auto;padding:12px;padding-bottom:80px}
.header{text-align:center;padding:16px 0 8px}
.header h1{font-size:20px;background:linear-gradient(135deg,#1565c0,#e65100);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{font-size:12px;color:#999;margin-top:4px}
.card{background:#fff;margin:8px 0;padding:14px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.match-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.match-teams{font-size:15px;font-weight:700}
.match-time{font-size:11px;color:#999}
.odds-row{display:flex;gap:8px;font-size:11px;margin-bottom:6px}
.odds-tag{background:#f0f0f0;padding:2px 8px;border-radius:4px;color:#666}
.odds-val{font-weight:700}
.strategy-box{background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border-radius:8px;padding:10px;margin-top:6px}
.strategy-box.negative{background:linear-gradient(135deg,#fce4ec,#ffebee)}
.strategy-box.neutral{background:linear-gradient(135deg,#e3f2fd,#e8eaf6)}
.roi-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700}
.roi-high{background:#2e7d32;color:#fff}
.roi-mid{background:#f9a825;color:#fff}
.roi-low{background:#e53935;color:#fff}
.bet-detail{font-size:12px;color:#555;margin-top:6px;line-height:1.6}
.section-title{font-size:14px;font-weight:700;margin:12px 0 8px;display:flex;align-items:center;gap:6px}
.section-title .dot{width:8px;height:8px;border-radius:50%}
.passed{opacity:.5;filter:grayscale(.3)}
.footer{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;padding:12px;border-top:1px solid #eee;text-align:center;font-size:11px;color:#999}
.note{font-size:11px;color:#999;padding:8px;text-align:center}
table td,table th{border-bottom:1px solid #eee}
.league-tag{font-size:10px;background:#e3f2fd;color:#1565c0;padding:1px 6px;border-radius:4px}
.reason-item{font-size:11px;color:#555;margin:2px 0 2px 8px;list-style:disc}
.team-stat{font-size:11px;color:#666;background:#fafafa;border-radius:6px;padding:6px 8px;margin-top:6px;line-height:1.5}
.odds-compare{display:flex;gap:10px;margin:4px 0;font-size:12px}
.odds-item{text-align:center;flex:1;background:#f8f8f8;border-radius:6px;padding:4px}
.odds-item .label{font-size:10px;color:#999}
.odds-item .value{font-size:14px;font-weight:700}
.odds-item.hot .value{color:#e53935}
.odds-item.rec .value{color:#2e7d32}
.nosignal-note{text-align:center;padding:20px;color:#999;font-size:13px}
</style>
</head>
<body>

<div class="header">
  <h1>⚽ 竞彩足球 · 反热门策略</h1>
  <p>V6 世界杯表现验证 | 数据更新: <span id="updateTime">—</span></p>
</div>

<div id="matchList"></div>

<div class="footer">
  <a href="index.html" style="color:#1565c0;text-decoration:none">← 返回数字彩</a> | 反被高估热门策略 | 模型仅供参考
</div>

<script>
// ===== 动态加载 V6 数据 =====
var MATCHES = [];
var DATA_READY = false;
var STRATEGY = '';
var NOSIGNAL_COUNT = 0;

fetch('data/jc_matches.json?' + Date.now())
  .then(function(r) { return r.json(); })
  .then(function(data) {
    MATCHES = data.matches || [];
    STRATEGY = data.summary ? data.summary.strategy : 'V6';
    NOSIGNAL_COUNT = data.summary ? (data.summary.total || 0) : 0;
    DATA_READY = true;
    render();
  })
  .catch(function(e) {
    // fallback: 尝试加载 jc_recommend_v6.json
    return fetch('jc_recommend_v6.json?' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        MATCHES = data.recommendations || [];
        NOSIGNAL_COUNT = data.no_signal || 0;
        STRATEGY = data.strategy || 'V6';
        DATA_READY = true;
        render();
      })
      .catch(function(e2) {
        document.getElementById('matchList').innerHTML = '<div class="card" style="text-align:center;color:#e53935;padding:30px">数据加载失败: ' + e2.message + '<br><small>请刷新重试</small></div>';
      });
  });

function render() {
  var html = '';
  var now = new Date();

  // 策略概览
  html += '<div class="card" style="padding:10px;text-align:center;background:linear-gradient(135deg,#fff8e1,#fff3e0)">';
  html += '<div style="font-size:12px;color:#888">' + STRATEGY + '</div>';
  html += '<div style="font-size:13px;color:#666;margin-top:4px">有信号 <b style="color:#2e7d32;font-size:18px">' + MATCHES.length + '</b> 场 | 无信号 <b style="color:#999;font-size:18px">' + NOSIGNAL_COUNT + '</b> 场</div>';
  html += '</div>';

  if (MATCHES.length === 0) {
    html += '<div class="card" style="text-align:center;color:#999;padding:30px">今天没有符合条件的热门被高估信号</div>';
    document.getElementById('matchList').innerHTML = html;
    document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
    return;
  }

  MATCHES.forEach(function(m) {
    var matchTime = m.matchDate ? (m.matchDate.slice(5) + ' ' + (m.matchTime || '')) : '—';
    var isPassed = false;
    if (m.matchDate && m.matchTime) {
      var dt = new Date(m.matchDate + 'T' + m.matchTime + ':00+08:00');
      isPassed = dt < now;
    }

    // 信心星级
    var stars = m.confidence || '★★';

    // 赔率比较: 热门赔率 vs 推荐赔率
    var favOdds = m.fav_odds || '—';
    var recOdds = m.recommend_odds || '—';

    html += '<div class="card' + (isPassed ? ' passed' : '') + '">';
    html += '<div class="match-header">';
    html += '<div class="match-teams"><span class="league-tag">' + (m.league || '竞彩') + '</span> ' + m.homeTeam + ' vs ' + m.awayTeam + '</div>';
    html += '<div class="match-time">' + matchTime +
      (isPassed ? ' <span style="color:#999">已结束</span>' : ' <span style="color:#e65100;font-weight:700">🔥 未开赛</span>') +
      '</div>';
    html += '</div>';

    // 热门 vs 推荐 赔率对比
    html += '<div class="odds-compare">';
    html += '<div class="odds-item hot"><div class="label">🔥 热门 ' + (m.fav_label || '') + '</div><div class="value">@' + favOdds.toFixed(2) + '</div></div>';
    html += '<div class="odds-item rec"><div class="label">🎯 推荐</div><div class="value" style="color:#2e7d32">@' + recOdds.toFixed(2) + '</div></div>';
    html += '</div>';

    // 推荐详情
    var boxClass = isPassed ? '' : 'neutral';
    html += '<div class="strategy-box ' + boxClass + '" style="padding:12px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center">';
    html += '<div>';
    html += '<span style="font-size:15px;font-weight:700">🎯 ' + m.recommend + '</span>';
    html += ' <span style="color:#e65100;font-weight:700;font-size:16px">@' + recOdds.toFixed(2) + '</span>';
    html += '</div>';
    html += '<span style="font-size:13px;color:#888">' + stars + '</span>';
    html += '</div>';

    // 理由
    if (m.reasons && m.reasons.length > 0) {
      html += '<div style="margin-top:8px">';
      m.reasons.forEach(function(r) {
        html += '<div class="reason-item">' + r + '</div>';
      });
      html += '</div>';
    }

    // 球队统计
    if (m.team_stats) {
      for (var team in m.team_stats) {
        var s = m.team_stats[team];
        if (s) {
          html += '<div class="team-stat">📊 ' + team + ': ' + s.played + '场 ' + s.wins + '胜 ' + s.draws + '平 ' + s.losses + '负 | 进' + s.gf + '失' + s.ga + (s.opponents && s.opponents.length ? ' | 对手: ' + s.opponents.join(',') : '') + '</div>';
        }
      }
    }

    html += '</div>'; // strategy-box
    html += '</div>'; // card
  });

  document.getElementById('matchList').innerHTML = html;
  document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
}
</script>
</body>
</html>
