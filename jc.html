.match-rec{display:flex;align-items:center;gap:8px;margin-top:6px;padding:6px 10px;background:#fff5f5;border-radius:6px;font-size:13px;color:var(--red);font-weight:700}

  // 推荐列表
  recs.forEach(function(r, idx) {
    var isTop = (idx === 0);
    html += '<div class="match-card">';
    html += '<div class="match-top">';
    if (isTop) html += '<span class="match-star">🏆</span>';
    html += '<span class="match-league">' + (r.league||'竞彩') + '</span>';
    if (r.matchNum) html += '<span style="font-size:10px;color:#bbb">' + r.matchNum + '</span>';
    html += '<span class="match-time">' + (r.matchDate||'') + ' ' + (r.matchTime||'') + '</span>';
    html += '</div>';
    html += '<div class="match-body">';
    html += '<div class="match-teams">' + r.homeTeam + ' <span class="match-vs">vs</span> ' + r.awayTeam + '</div>';
    html += '<div class="match-odds">';
    var items = [
      {label:'主胜', val:r.had_h, pick:r.recommend==='主胜'},
      {label:'平局', val:r.had_d, pick:r.recommend==='平局'},
      {label:'客胜', val:r.had_a, pick:r.recommend==='客胜'}
    ];
    items.forEach(function(oi) {
      html += '<div class="odds-box' + (oi.pick?' pick':'') + '">';
      html += '<div class="odds-label">' + oi.label + '</div>';
      html += '<div class="odds-val">' + (oi.val ? oi.val.toFixed(2) : '-') + '</div>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="match-rec">🏆 推荐 ' + r.recommend + ' @ ' + r.best_odds + ' <span class="match-conf">' + (r.confidence||'⭐') + '</span></div>';
    
    var detailId = 'detail_' + idx;
    var hasReasons = r.reasons && r.reasons.length > 0;
    html += '<div class="detail-btn" onclick="toggleDetail(\'' + detailId + '\')">' + (hasReasons ? '📊 查看分析理由 ▼' : '📊 价值评分: ' + r.score) + '</div>';
    html += '<div class="match-detail" id="' + detailId + '">';
    if (hasReasons) {
      html += '<div style="padding:8px 0;font-size:12px;color:#666;line-height:1.8">';
      r.reasons.forEach(function(reason) { html += '• ' + reason + '<br>'; });
      html += '</div>';
    }
    // 阵容深度展示
    if (r.home_players || r.away_players) {
      html += '<div style="margin:8px 0;padding:8px;background:#f8f9fa;border-radius:8px;font-size:11px;line-height:1.6">';
      if (r.home_players) {
        var hc = r.home_coach && r.home_coach !== '—' ? ' ' + r.home_coach : '';
        html += '<div style="font-weight:600;margin-bottom:4px">' + r.homeTeam + ': ' + (r.home_player_count||'?') + '人' + hc + (r.home_avg_age ? ' 均龄' + r.home_avg_age + '岁' : '') + '</div>';
        html += '<div style="color:#888">' + r.home_players.slice(0,5).join(', ') + '</div>';
      }
      if (r.away_players) {
        var ac = r.away_coach && r.away_coach !== '—' ? ' ' + r.away_coach : '';
        html += '<div style="font-weight:600;margin:4px 0 4px 0">' + r.awayTeam + ': ' + (r.away_player_count||'?') + '人' + ac + (r.away_avg_age ? ' 均龄' + r.away_avg_age + '岁' : '') + '</div>';
        html += '<div style="color:#888">' + r.away_players.slice(0,5).join(', ') + '</div>';
      }
      html += '</div>';
    }
    html += '<div style="font-size:11px;color:#999;padding:4px 0;border-top:1px solid #f5f5f5">';
    html += '评分: ' + r.score;
    if (r.ev !== undefined) html += ' | EV: ' + (r.ev > 0 ? '<span style="color:#4caf50">' : '') + (r.ev > 0 ? '+' : '') + r.ev + '%' + (r.ev > 0 ? '</span>' : '');
    html += ' | 抽水: ' + r.juice + '%';
    // 价值重叠分析：市场隐含概率 vs 模型公平概率
    if (r.value_overlay && r.value_overlay.length > 0) {
      var vo = r.value_overlay;
      html += '<div style="margin-top:4px;font-size:10px;border-top:1px dashed #eee;padding-top:4px">';
      html += '<span style="font-weight:600">价值对标:</span> ';
      vo.forEach(function(v, vi) {
        var cls = '';
        if (v.label === r.recommend) cls = ' style="color:#c62828;font-weight:700"';
        html += '<span' + cls + '>' + v.label + ' 市场' + v.market_prob + '% vs 模型' + v.fair_prob + '%' + (v.value_gap > 0 ? ' ▲' : '') + (v.value_gap < 0 ? ' ▼' : '') + '</span>';
        if (vi < vo.length - 1) html += ' | ';
      });
      html += '</div>';
    }
    // 球队状态（当有数据时显示）
    if (r.home_form && r.away_form) {
      html += '<div style="font-size:10px;color:#666;margin-top:2px">';
      html += r.homeTeam + ' ' + r.home_form + ' | ' + r.awayTeam + ' ' + r.away_form;
      html += '</div>';
    }
    // 凯利建议
    if (r.kelly_advice && r.kelly_advice.suggest_stake > 0) {
      html += '<br>💰 ' + r.kelly_advice.note;
    }
    if (r.home_group) html += '<br>📌 ' + r.home_group + ' | ' + r.homeTeam + ' 实力:' + (r.home_strength||'?') + ' ' + r.awayTeam + ' 实力:' + (r.away_strength||'?');
    html += '</div></div>';
    html += '</div></div>';
  });
  
  ml.innerHTML = html;
  ml.style.display = 'block';
  
  if (recs.length === 0) { ml.style.display = 'none'; em.style.display = 'block'; }
}

function init() {
  var ml = document.getElementById('matchList');
  var ld = document.getElementById('loadingIndicator');
  var em = document.getElementById('emptyMessage');
  
  // 先用内嵌数据渲染
  if (JC_DATA && JC_DATA.recommendations && JC_DATA.recommendations.length > 0) {
    renderData(JC_DATA);
  } else {
    ld.style.display = 'none';
    em.style.display = 'block';
  }
  
  // 同时尝试fetch最新数据（如果成功则覆盖）
  fetch('jc_recommend.json?_t=' + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error('No remote data');
      return r.json();
    })
    .then(function(data) {
      if (data && data.recommendations && data.recommendations.length > 0) {
        renderData(data);
      }
    })
    .catch(function() {
      // 静默失败，已用内嵌数据展示
    });
}

function toggleDetail(id) {
  var el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body></html>
