<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>竞彩足球 · 双盘分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,Segoe UI,sans-serif;background:#f5f5f5;color:#333;max-width:480px;margin:0 auto;padding:12px;padding-bottom:80px}
.header{text-align:center;padding:16px 0 8px}
.header h1{font-size:20px;background:linear-gradient(135deg,#1565c0,#e65100);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{font-size:12px;color:#999;margin-top:4px}
.card{background:#fff;margin:8px 0;padding:14px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.match-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.match-teams{font-size:15px;font-weight:700}
.match-time{font-size:11px;color:#999}
.odds-row{display:flex;gap:8px;font-size:11px;margin-bottom:6px}
.odds-tag{background:#f0f0f0;padding:2px 8px;border-radius:4px;color:#666}
.odds-val{font-weight:700}
.strategy-box{background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border-radius:8px;padding:10px;margin-top:6px}
.strategy-box.negative{background:linear-gradient(135deg,#fce4ec,#ffebee)}
.roi-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700}
.roi-high{background:#2e7d32;color:#fff}
.roi-mid{background:#f9a825;color:#fff}
.roi-low{background:#e53935;color:#fff}
.bet-detail{font-size:12px;color:#555;margin-top:6px;line-height:1.6}
.section-title{font-size:14px;font-weight:700;margin:12px 0 8px;display:flex;align-items:center;gap:6px}
.section-title .dot{width:8px;height:8px;border-radius:50%}
.filter-bar{display:flex;gap:6px;margin:8px 0;overflow-x:auto}
.filter-btn{padding:6px 14px;border:1px solid #ddd;border-radius:16px;font-size:12px;background:#fff;cursor:pointer;white-space:nowrap}
.filter-btn.active{background:#1565c0;color:#fff;border-color:#1565c0}
.passed{opacity:.5;filter:grayscale(.3)}
.footer{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;padding:12px;border-top:1px solid #eee;text-align:center;font-size:11px;color:#999}
.note{font-size:11px;color:#999;padding:8px;text-align:center}
</style>
</head>
<body>

<div class="header">
  <h1>⚽ 竞彩足球 · 双盘分析</h1>
  <p>泊松模型 + HAD×HHAD 双盘ROI | 数据更新: <span id="updateTime">—</span></p>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" onclick="filter('all')">全部</button>
  <button class="filter-btn" onclick="filter('today')">今天可买</button>
</div>

<div id="matchList"></div>

<div class="footer">
  基于HHAD让球盘泊松拟合 | 模型仅供参考 | 投资有风险
</div>

<script>
// ===== 嵌入数据 =====
var MATCHES = [
{"match":"周日010","home":"荷兰","away":"日本","date":"2026-06-15","time":"04:00","had":[1.86,3.33,3.43],"hhad":[4.0,3.4,1.71],"gl":"-1.00"},
{"match":"周日011","home":"科特迪瓦","away":"厄瓜多尔","date":"2026-06-15","time":"07:00","had":[3.15,2.65,2.3],"hhad":[1.45,3.8,5.65],"gl":"+1.00"},
{"match":"周日012","home":"瑞典","away":"突尼斯","date":"2026-06-15","time":"10:00","had":[1.67,3.35,4.3],"hhad":[3.32,3.17,1.95],"gl":"-1.00"},
{"match":"周一014","home":"比利时","away":"埃及","date":"2026-06-16","time":"03:00","had":[1.43,3.84,5.9],"hhad":[2.56,3.2,2.35],"gl":"-1.00"},
{"match":"周一015","home":"沙特","away":"乌拉圭","date":"2026-06-16","time":"06:00","had":[7.65,4.25,1.31],"hhad":[2.84,3.3,2.11],"gl":"+1.00"},
{"match":"周一016","home":"伊朗","away":"新西兰","date":"2026-06-16","time":"09:00","had":[1.56,3.3,5.4],"hhad":[3.1,3.1,2.07],"gl":"-1.00"},
{"match":"周二017","home":"法国","away":"塞内加尔","date":"2026-06-17","time":"03:00","had":[1.35,4.02,7.15],"hhad":[2.23,3.22,2.7],"gl":"-1.00"},
{"match":"周二019","home":"阿根廷","away":"阿尔及利","date":"2026-06-17","time":"09:00","had":[1.26,4.4,9.2],"hhad":[1.95,3.35,3.15],"gl":"-1.00"},
{"match":"周二020","home":"奥地利","away":"约旦","date":"2026-06-17","time":"12:00","had":[1.21,5.15,9.2],"hhad":[1.79,3.56,3.45],"gl":"-1.00"},
{"match":"周三021","home":"葡萄牙","away":"刚果金","date":"2026-06-18","time":"01:00","had":[1.14,5.7,13.0],"hhad":[2.7,3.93,1.98],"gl":"-2.00"},
{"match":"周三022","home":"英格兰","away":"克罗地亚","date":"2026-06-18","time":"04:00","had":[1.53,3.5,5.25],"hhad":[2.84,3.2,2.15],"gl":"-1.00"},
{"match":"周三023","home":"加纳","away":"巴拿马","date":"2026-06-18","time":"07:00","had":[1.96,3.0,3.5],"hhad":[4.25,3.52,1.64],"gl":"-1.00"},
{"match":"周三024","home":"乌兹别克","away":"哥伦比亚","date":"2026-06-18","time":"10:00","had":[9.1,4.55,1.25],"hhad":[3.12,3.44,1.93],"gl":"+1.00"}
];

// ===== 泊松 =====
function poisson(k, lam) {
  if (k > 150 || lam <= 0) return 0;
  var r = Math.exp(-lam);
  for (var i = 1; i <= k; i++) r *= lam / i;
  return r;
}

function analyze(m) {
  var h = m.had, hh = m.hhad, gl = parseFloat(m.gl);
  // HAD去水
  var hs = 1/h[0]+1/h[1]+1/h[2];
  var ph = 1/h[0]/hs, pd = 1/h[1]/hs, pa = 1/h[2]/hs;
  // HHAD去水
  var hhs = 1/hh[0]+1/hh[1]+1/hh[2];
  var phc = 1/hh[0]/hhs, php = 1/hh[1]/hhs, pac = 1/hh[2]/hhs;

  // 泊松拟合
  var bestErr = 999, bl = 1, bu = 1, agl = Math.abs(gl);

  if (gl < 0) {
    for (var lh = 0.5; lh <= 4; lh += 0.1) {
      for (var la = 0; la <= 2; la += 0.1) {
        var p1 = 0, p2 = 0, p3 = 0;
        for (var h0 = 0; h0 < 11; h0++) for (var a0 = 0; a0 < 7; a0++) {
          var prob = poisson(h0,lh)*poisson(a0,la);
          if (h0-a0 >= agl+1) p1 += prob;
          else if (h0-a0 === agl) p2 += prob;
          else p3 += prob;
        }
        var err = Math.abs(p1-phc)+Math.abs(p2-php)+Math.abs(p3-pac);
        if (err < bestErr) { bestErr = err; bl = lh; bu = la; }
      }
    }
    // 概率
    var by1 = 0, by2p = 0;
    for (var h0=0;h0<11;h0++) for(var a0=0;a0<7;a0++) {
      var prob = poisson(h0,bl)*poisson(a0,bu);
      if (h0>a0 && h0-a0===1) by1 += prob;
      else if (h0>a0 && h0-a0>=2) by2p += prob;
    }
    var pd2 = 0; for (var s=0;s<11;s++) pd2 += poisson(s,bl)*poisson(s,bu);
    var pa2 = 1 - by1 - by2p - pd2;
    // 双盘: 主胜HAD + 客受让HHAD  
    var ev = by1*(h[0]+hh[2]) + by2p*h[0] + (pd2+pa2)*hh[2];
    return {
      roi: Math.round((ev-2)/2*1000)/10,
      ev: ev.toFixed(2),
      hWin: Math.round((by1+by2p)*1000)/10,
      draw: Math.round(pd2*1000)/10,
      aWin: Math.round(pa2*1000)/10,
      err: Math.round(bestErr*1000)/10,
      lam: bl+'/'+bu,
      strategy: '主队胜('+h[0].toFixed(2)+') + 客队+'+Math.abs(gl)+'('+hh[2].toFixed(2)+')',
      bet: 'HAD主胜@'+h[0]+' + HHAD客受让@'+hh[2]
    };
  } else { // gl > 0
    for (var lh = 0; lh <= 2; lh += 0.1) {
      for (var la = 0.5; la <= 4; la += 0.1) {
        var p1 = 0, p2 = 0, p3 = 0;
        for (var h0 = 0; h0 < 11; h0++) for (var a0 = 0; a0 < 7; a0++) {
          var prob = poisson(h0,lh)*poisson(a0,la);
          var diff = h0 - a0;
          if (diff >= -1) p1 += prob;
          else if (diff === -2) p2 += prob;
          else p3 += prob;
        }
        var err = Math.abs(p1-phc)+Math.abs(p2-php)+Math.abs(p3-pac);
        if (err < bestErr) { bestErr = err; bl = lh; bu = la; }
      }
    }
    var awBy1 = 0, awBy2p = 0;
    for (var h0=0;h0<11;h0++) for(var a0=0;a0<7;a0++) {
      var prob = poisson(h0,bl)*poisson(a0,bu);
      if (a0>h0 && a0-h0===1) awBy1 += prob;
      else if (a0>h0 && a0-h0>=2) awBy2p += prob;
    }
    var pd2 = 0; for (var s=0;s<11;s++) pd2 += poisson(s,bl)*poisson(s,bu);
    var ph2 = 0; for (var h0=1;h0<11;h0++) for(var a0=0;a0<h0;a0++) ph2 += poisson(h0,bl)*poisson(a0,bu);
    // 双盘: 客胜HAD + 主受让HHAD
    var ev = awBy1*(h[2]+hh[0]) + awBy2p*h[2] + (ph2+pd2)*hh[0];
    return {
      roi: Math.round((ev-2)/2*1000)/10,
      ev: ev.toFixed(2),
      hWin: Math.round(ph2*1000)/10,
      draw: Math.round(pd2*1000)/10,
      aWin: Math.round((awBy1+awBy2p)*1000)/10,
      err: Math.round(bestErr*1000)/10,
      lam: bl+'/'+bu,
      strategy: '客队胜('+h[2].toFixed(2)+') + 主队+'+Math.abs(gl)+'('+hh[0].toFixed(2)+')',
      bet: 'HAD客胜@'+h[2]+' + HHAD主受让@'+hh[0]
    };
  }
}

// 判断是否已过
function isPassed(m) {
  var dt = new Date(m.date + 'T' + m.time + ':00+08:00');
  return dt < new Date();
}

// 渲染
function render(filterMode) {
  var html = '';
  var now = new Date();
  var today = now.toISOString().slice(0,10);
  
  MATCHES.forEach(function(m) {
    var r = analyze(m);
    var passed = isPassed(m);
    
    // 根据匹配筛选
    var matchDay = m.date;
    if (filterMode === 'today' && (passed || matchDay < today)) return;

    var roiClass = r.roi > 10 ? 'roi-high' : (r.roi > 0 ? 'roi-mid' : 'roi-low');
    var boxClass = r.roi < 0 ? 'negative' : '';
    var statusTag = passed ? '<span style="color:#999;font-size:11px">已结束</span>' 
      : (matchDay === today ? '<span style="color:#e65100;font-size:11px;font-weight:700">🔥 今天</span>' 
        : '<span style="color:#1565c0;font-size:11px">即将</span>');

    html += '<div class="card' + (passed ? ' passed' : '') + '">';
    html += '<div class="match-header">';
    html += '<div class="match-teams">' + m.match + ' ' + m.home + ' vs ' + m.away + '</div>';
    html += '<div class="match-time">' + m.date.slice(5) + ' ' + m.time + ' ' + statusTag + '</div>';
    html += '</div>';
    
    html += '<div class="odds-row">';
    html += '<span class="odds-tag">HAD</span>';
    html += '<span>' + m.had[0].toFixed(2) + ' / ' + m.had[1].toFixed(2) + ' / ' + m.had[2].toFixed(2) + '</span>';
    html += '</div>';
    html += '<div class="odds-row">';
    html += '<span class="odds-tag">HHAD ' + m.gl + '</span>';
    html += '<span>' + m.hhad[0].toFixed(2) + ' / ' + m.hhad[1].toFixed(2) + ' / ' + m.hhad[2].toFixed(2) + '</span>';
    html += '</div>';

    html += '<div class="strategy-box ' + boxClass + '">';
    html += '<span class="roi-badge ' + roiClass + '">' + (r.roi > 0 ? '+' : '') + r.roi.toFixed(1) + '%</span>';
    html += '<span style="margin-left:6px;font-size:13px;font-weight:700">' + r.strategy + '</span>';
    html += '<div class="bet-detail">';
    html += '📊 泊松λ=' + r.lam + ' | 主' + r.hWin + '% 平' + r.draw + '% 客' + r.aWin + '% | 拟合误差' + r.err + '%';
    html += '<br>💰 ' + r.bet + ' | 预期回报 ' + r.ev + '元/2元';
    html += '</div></div></div>';
  });

  document.getElementById('matchList').innerHTML = html || '<div class="card" style="text-align:center;color:#999;padding:30px">没有符合条件的比赛</div>';
  document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
}

function filter(mode) {
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  event.target.classList.add('active');
  render(mode);
}

render('all');
</script>
</body>
</html>
