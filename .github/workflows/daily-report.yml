name: Daily Lottery Report

on:
  schedule:
    - cron: "30 13 * * *"  # UTC 13:30 = 北京时间 21:30
  workflow_dispatch:  # 允许手动触发

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send lottery report
        env:
          QQMAIL_AUTH: ${{ secrets.QQMAIL_AUTH }}
        run: python qqmail_notify.py
