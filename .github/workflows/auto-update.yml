name: 每日更新开奖数据
on:
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [auto-update]
  # ⚠️ 不监听 push，避免手动推送代码时触发冲突

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch data (数字彩)
        run: python3 scripts/fetch_data.py

      - name: Compute recommendations (数字彩)
        run: python3 scripts/gen_recommendations.py

      # ========== 竞彩管道 ==========
      - name: Fetch WC results (竞彩)
        run: python3 scripts/jc_results.py

      - name: V6 ELO+Poisson analysis (竞彩)
        run: python3 scripts/jc_analysis_v6.py

      - name: Commit & push data changes
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PUSH_URL="https://${PAT}@github.com/a1450652408-collab/lottery-analyst.git"

          # === 先拉取远程避免冲突（autostash 自动暂存脚本生成的文件变更）===
          git pull --rebase --autostash "$PUSH_URL" master

          # === 提交数据变化（数字彩 + 竞彩；全量 add，确保 index_modified.html / deploy 也入库）===
          DATA_CHANGED=false
          git add -A
          if ! git diff --staged --quiet; then
            DATA_CHANGED=true
            git commit -m "data: auto-update $(date +%Y-%m-%d)"
            git push "$PUSH_URL" master
            echo "✅ 数据已更新并推送"
          else
            echo "📭 数据无变化"
          fi
