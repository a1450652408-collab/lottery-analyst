name: 每日更新开奖数据
on:
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [auto-update]
  # ⚠️ 不监听 push，避免手动推送代码时触发冲突

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch data
        run: python3 scripts/fetch_data.py

      - name: Compute recommendations
        run: python3 scripts/gen_recommendations.py

      - name: Commit & push data changes
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PUSH_URL="https://${PAT}@github.com/a1450652408-collab/lottery-analyst.git"

          # === 先拉取远程避免冲突 ===
          git pull --rebase "$PUSH_URL" master

          # === 提交数据变化（index.html + saved_recs.json）===
          DATA_CHANGED=false
          git add index.html data/saved_recs.json
          if ! git diff --staged --quiet; then
            DATA_CHANGED=true
            git commit -m "data: auto-update $(date +%Y-%m-%d)"
            git push "$PUSH_URL" master
            echo "✅ 数据已更新并推送"
          else
            echo "📭 数据无变化"
          fi
