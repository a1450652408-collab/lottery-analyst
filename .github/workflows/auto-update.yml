name: 每日更新开奖数据
on:
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [auto-update]
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch data
        run: python3 scripts/fetch_data.py

      - name: Compute recommendations
        run: python3 scripts/gen_recommendations.py

      - name: Commit, push & chain-trigger next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 从 git remote URL 提取 PAT token（用于 push 以触发新 workflow）
          # PAT 有 contents:write 权限，push 会触发新的 workflow run
          PAT=$(git config --get remote.origin.url | sed 's|https://||;s|@.*||')
          PUSH_URL="https://${PAT}@github.com/a1450652408-collab/lottery-analyst.git"

          # === 1. 提交数据变化 ===
          DATA_CHANGED=false
          git add index.html data/saved_recs.json
          if ! git diff --staged --quiet; then
            DATA_CHANGED=true
            git commit -m "data: auto-update $(date +%Y-%m-%d)"
            git push "$PUSH_URL" master
            echo "✅ 数据已更新并推送"
          else
            echo "📭 数据无变化"
          fi

          # === 2. 自链式触发：push时间戳保活，维持工作流链 ===
          LAST_PUSH_FILE=.last-push
          if [ -f "$LAST_PUSH_FILE" ]; then
            LAST_TS=$(cat "$LAST_PUSH_FILE" | head -1)
          else
            LAST_TS=0
          fi
          NOW=$(date +%s)
          HOURS_SINCE=$(( (NOW - LAST_TS) / 3600 ))

          if [ "$HOURS_SINCE" -ge 6 ]; then
            echo "$NOW" > "$LAST_PUSH_FILE"
            git add "$LAST_PUSH_FILE"
            git commit -m "chore: keep-alive $(date +%Y-%m-%d_%H:%M)"
            git push "$PUSH_URL" master
            echo "✅ 保活推送成功，工作流链已维持（上次推送 ${HOURS_SINCE}h 前）"
          else
            echo "🕐 距上次推送仅 ${HOURS_SINCE}h（<6h），跳过保活推送"
            if [ "$DATA_CHANGED" = "false" ]; then
              echo "工作流链暂停，等待下次触发"
            fi
          fi
