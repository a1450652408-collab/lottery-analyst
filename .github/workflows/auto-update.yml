name: 每日更新开奖数据
on:
  # 北京时间 00:00 = UTC 16:00
  schedule:
    - cron: '0 16 * * *'
  # 备用调度：每2小时检查一次（如果主调度漏了，这个也能兜底）
    - cron: '0 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [auto-update]
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch data
        run: python3 scripts/fetch_data.py
      - name: Compute recommendations
        run: python3 scripts/gen_recommendations.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/saved_recs.json
          if git diff --staged --quiet; then echo "No changes"; else git commit -m "data: auto-update $(date +%Y-%m-%d)"; git push; fi
