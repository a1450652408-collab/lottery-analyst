name: 每日更新开奖数据

on:
  schedule:
    # 各彩种开奖时间(北京): 快乐8/3D/排列3/排列5 约 21:30, 大乐透/七星彩 20:30, 双色球 21:15(二四日)
    # GitHub 的 cron 是 UTC, 且经常被延迟甚至丢弃(实测今天: 03:07/03:26/06:18/10:06/16:07/21:20 才跑),
    # 所以开奖后连发 3 次兜底, 而不是只依赖"每 2 小时"。
    - cron: '50 13 * * *'      # 21:50 北京 —— 开奖后第一时间
    - cron: '20 14 * * *'      # 22:20 北京 —— 兜底 1
    - cron: '20 15 * * *'      # 23:20 北京 —— 兜底 2
    - cron: '0 16 * * *'       # 00:00 北京 —— 跨日兜底(含双色球/大乐透)
    - cron: '0 */2 * * *'      # 每 2 小时巡检
  workflow_dispatch:
  repository_dispatch:
    types: [auto-update]
  # ⚠️ 不监听 push，避免手动推送代码时触发冲突

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ========== 1. 数字彩数据（内嵌 __LOTTERY_DATA ×3 + data/*.json 同步）==========
      - name: Fetch data (数字彩)
        run: python3 scripts/fetch_data.py

      # ========== 2. 地方彩种历史补齐（ttcx4 / 15选5，接口不覆盖）==========
      - name: Fetch local lottery history (ttcx4 / sh15x5)
        continue-on-error: true
        run: |
          python3 scripts/fetch_history_eastmoney.py ttcx4
          python3 scripts/fetch_history_eastmoney.py sh15x5

      # ========== 3. 推荐与派生数据（页面运行时 fetch 的文件必须一起刷新）==========
      - name: Compute recommendations (数字彩)
        run: python3 scripts/gen_recommendations.py

      - name: Deep analysis (快乐8 走势 + 数字彩)
        run: |
          python3 scripts/kl8_trend_deep.py
          python3 scripts/digit_deep_analysis.py

      - name: Archive recommendations (历史归档 + 橙紫卡命中)
        run: |
          python3 scripts/backup_all_recs.py
          node scripts/backup_orange_purple_hits.js

      # ========== 4. 竞彩管道（外部数据，失败不阻塞数字彩入库）==========
      - name: Fetch WC results (竞彩)
        continue-on-error: true
        run: python3 scripts/jc_results.py

      - name: V6 ELO+Poisson analysis (竞彩)
        continue-on-error: true
        run: python3 scripts/jc_analysis_v6.py

      # ========== 5. 数据完整性校验（发现问题则中止，避免把坏数据推上线）==========
      - name: Verify data integrity
        run: node scripts/project_audit.js

      # ========== 6. 提交并推送 ==========
      - name: Commit & push data changes
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PUSH_URL="https://${PAT}@github.com/a1450652408-collab/lottery-analyst.git"

          # === 先拉取远程避免冲突（autostash 自动暂存脚本生成的文件变更）===
          git pull --rebase --autostash "$PUSH_URL" master

          # === 提交数据变化（全量 add，确保 index.html / deploy / data 一起入库）===
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "data: auto-update $(date +%Y-%m-%d)"
            git push "$PUSH_URL" master
            echo "✅ 数据已更新并推送"
          else
            echo "📭 数据无变化"
          fi
