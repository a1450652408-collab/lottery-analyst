name: 部署到 Cloudflare Pages

# ⚠️ 说明（2026-10-16 修复）:
#   1. 原入参名写成 api-token / account-id，wrangler-action@v3 实际要求 apiToken / accountId，
#      导致 token 从未传入 → 每次推送都失败。
#   2. 仓库中并不存在 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 两个 secret，
#      因此本工作流无法成功；线上站点实际由 GitHub Pages 构建
#      (https://a1450652408-collab.github.io/lottery-analyst/)。
#   3. 改为仅手动触发，避免每次数据自动提交都产生一次失败记录；
#      补齐上面两个 secret 后，可在 Actions 页面手动 Run 该工作流进行部署。
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=lottery-analyst --branch=master
